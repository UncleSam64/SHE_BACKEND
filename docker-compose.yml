backend:
  build:
    context: .
    dockerfile: Dockerfile
  command: ["npm", "run", "dev"]
  container_name: backend_container
  working_dir: /workspace
  depends_on:
    sqlserver:
      condition: service_started
      required: true
  environment:
    DB_HOST: sqlserver
    DB_NAME: DB
    DB_PASS: Ibackend123
    DB_PORT: "1433"
    DB_USER: bnd
  ports:
    - "3000:3000"
  volumes:
    - .:/workspace
