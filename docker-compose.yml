version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_container
    command: npm run dev
    depends_on:
      - sqlserver
    environment:
      DB_HOST: sqlserver
      DB_NAME: DB
      DB_USER: bnd
      DB_PASS: Ibackend123
      DB_PORT: 1433
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    networks:
      - backend_network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver_container
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      SA_PASSWORD: Ibackend123
    ports:
      - "1433:1433"
    restart: always
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge

volumes:
  sqlserver_data:
